name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: 'service_f6euc1t'
          VITE_EMAILJS_TEMPLATE_ID: 'template_7ruhvzt'
          VITE_EMAILJS_PUBLIC_KEY: 'sJXh1S_l8MluKhMyi'
          VITE_EMAILJS_TO_EMAIL: 'srivenkateshwaravechicles@gmail.com'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages via Actions
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages Branch (Branch Backup)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
